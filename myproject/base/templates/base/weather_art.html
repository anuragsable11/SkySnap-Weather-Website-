{% comment %}
  Weather illustration. Pass art= one of the keys made by base.views.weather_art:
  clear-day, clear-night, partly-day, partly-night, cloudy, rain, storm, snow, mist.
  Animations live in style.css under "Weather art".
{% endcomment %}
<svg class="art" viewBox="0 0 128 128" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="art-sun" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff4b8"/>
      <stop offset="0.55" stop-color="#ffd34d"/>
      <stop offset="1" stop-color="#ffa92e"/>
    </radialGradient>
    <radialGradient id="art-sun-glow">
      <stop offset="0.5" stop-color="#fff6d6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#fff6d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="art-moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffbea"/>
      <stop offset="1" stop-color="#c9d1ee"/>
    </linearGradient>
    <linearGradient id="art-cloud" x1="0" y1="40" x2="0" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cbd9ef"/>
    </linearGradient>
    <linearGradient id="art-cloud-grey" x1="0" y1="40" x2="0" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dfe6f2"/>
      <stop offset="1" stop-color="#97a6c0"/>
    </linearGradient>
    <linearGradient id="art-cloud-dark" x1="0" y1="40" x2="0" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#97a3bb"/>
      <stop offset="1" stop-color="#4f5a73"/>
    </linearGradient>
    <mask id="art-crescent">
      <rect width="128" height="128" fill="#fff"/>
      <circle cx="80" cy="50" r="24" fill="#000"/>
    </mask>
    <g id="art-cloud-shape">
      <circle cx="46" cy="80" r="18"/>
      <circle cx="70" cy="66" r="25"/>
      <circle cx="93" cy="82" r="15"/>
      <rect x="28" y="78" width="80" height="24" rx="12"/>
    </g>
    <g id="art-sun-shape">
      <circle cx="64" cy="64" r="46" fill="url(#art-sun-glow)"/>
      <path class="art-rays" d="M100 64h12M89.5 89.5l8.5 8.5M64 100v12M38.5 89.5 30 98M28 64H16M38.5 38.5 30 30M64 28V16M89.5 38.5 98 30"
            stroke="#ffc93c" stroke-width="6" stroke-linecap="round"/>
      <circle cx="64" cy="64" r="26" fill="url(#art-sun)"/>
    </g>
    <path id="art-sparkle" d="M0-6 1.6-1.6 6 0 1.6 1.6 0 6-1.6 1.6-6 0-1.6-1.6z" fill="#fff6d5"/>
  </defs>

  {% if art == 'clear-day' %}
    <use href="#art-sun-shape"/>

  {% elif art == 'clear-night' %}
    <circle cx="62" cy="64" r="30" fill="url(#art-moon)" mask="url(#art-crescent)"/>
    <use class="art-star" href="#art-sparkle" x="98" y="80"/>
    <use class="art-star" href="#art-sparkle" x="30" y="30" style="--delay: -1.2s"/>
    <use class="art-star" href="#art-sparkle" x="104" y="36" style="--delay: -2.1s"/>

  {% elif art == 'partly-day' %}
    <g transform="translate(10 6) scale(0.62)"><use href="#art-sun-shape"/></g>
    <g class="art-float"><use href="#art-cloud-shape" fill="url(#art-cloud)" transform="translate(4 8)"/></g>

  {% elif art == 'partly-night' %}
    <g transform="translate(8 2) scale(0.62)">
      <circle cx="62" cy="64" r="30" fill="url(#art-moon)" mask="url(#art-crescent)"/>
    </g>
    <use class="art-star" href="#art-sparkle" x="96" y="26" style="--delay: -0.8s"/>
    <g class="art-float"><use href="#art-cloud-shape" fill="url(#art-cloud)" transform="translate(4 8)"/></g>

  {% elif art == 'cloudy' %}
    <g class="art-float art-float-slow"><use href="#art-cloud-shape" fill="url(#art-cloud-grey)" transform="translate(32 -8) scale(0.7)"/></g>
    <g class="art-float"><use href="#art-cloud-shape" fill="url(#art-cloud)" transform="translate(-6 8)"/></g>

  {% elif art == 'rain' %}
    <g stroke="#74c0ff" stroke-width="5" stroke-linecap="round">
      <path class="art-drop" d="M42 100l-4 10"/>
      <path class="art-drop" d="M58 104l-4 10" style="--delay: -0.35s"/>
      <path class="art-drop" d="M74 100l-4 10" style="--delay: -0.7s"/>
      <path class="art-drop" d="M90 104l-4 10" style="--delay: -0.2s"/>
    </g>
    <g class="art-float"><use href="#art-cloud-shape" fill="url(#art-cloud-grey)" transform="translate(-4 -12)"/></g>

  {% elif art == 'storm' %}
    <g stroke="#74c0ff" stroke-width="5" stroke-linecap="round">
      <path class="art-drop" d="M40 100l-4 10" style="--delay: -0.4s"/>
      <path class="art-drop" d="M94 100l-4 10"/>
    </g>
    <path class="art-bolt" d="M66 78 52 102h12l-6 22 22-30H67l7-16z" fill="#ffd84d"/>
    <use href="#art-cloud-shape" fill="url(#art-cloud-dark)" transform="translate(-4 -14)"/>

  {% elif art == 'snow' %}
    <g fill="#ffffff">
      <circle class="art-flake" cx="42" cy="102" r="4"/>
      <circle class="art-flake" cx="60" cy="110" r="3.5" style="--delay: -1.1s"/>
      <circle class="art-flake" cx="78" cy="102" r="4" style="--delay: -2.3s"/>
      <circle class="art-flake" cx="94" cy="110" r="3.5" style="--delay: -0.6s"/>
    </g>
    <g class="art-float"><use href="#art-cloud-shape" fill="url(#art-cloud)" transform="translate(-4 -12)"/></g>

  {% else %}
    <g class="art-float"><use href="#art-cloud-shape" fill="url(#art-cloud-grey)" transform="translate(-4 -18)" opacity="0.9"/></g>
    <g stroke="#d7e0ee" stroke-width="6" stroke-linecap="round" opacity="0.85">
      <path class="art-haze" d="M24 96h60"/>
      <path class="art-haze" d="M40 108h66" style="--delay: -2s"/>
      <path class="art-haze" d="M28 120h48" style="--delay: -4s"/>
    </g>
  {% endif %}
</svg>
